version: 2
project_name: glab-docs

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - main: ./cmd/glab-docs
    binary: glab-docs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}{{ .Arch }}{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# .github/workflows/release.yml already creates the GitHub release as a draft before
# pushing the tag (title = the version, no "v" prefix; notes from git-cliff). Attach
# artifacts to that existing draft instead of creating a second, duplicate release for
# the same tag, then publish it once uploads finish. name_template must match the title
# release.yml sets ("$RELEASE_VERSION"), since GoReleaser looks up the draft by name.
release:
  name_template: "{{ .Version }}"
  use_existing_draft: true
  draft: false

# Only runs when the Release workflow imports a GPG key (SIGNING_KEY secret set);
# otherwise the workflow passes --skip=sign.
signs:
  - artifacts: checksum
    args:
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

nfpms:
  - vendor: m13tLabs
    homepage: https://github.com/m13tLabs/glab-docs
    maintainer: m13tLabs <martin@m13t.de>
    description: Automatically generate markdown documentation for GitLab CI components and pipelines
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}{{ .Arch }}{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

# Container images are built from the multi-stage Dockerfile by docker/build-push-action
# in .github/workflows/release.yml, not by GoReleaser.
