version: 2
project_name: glab-docs

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - main: ./cmd/glab-docs
    binary: glab-docs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}{{ .Arch }}{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Only runs when the Release workflow imports a GPG key (SIGNING_KEY secret set);
# otherwise the workflow passes --skip=sign.
signs:
  - artifacts: checksum
    args:
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

nfpms:
  - vendor: m13tLabs
    homepage: https://github.com/m13tLabs/glab-docs
    maintainer: m13tLabs <martin@m13t.de>
    description: Automatically generate markdown documentation for GitLab CI components and pipelines
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}{{ .Arch }}{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

dockers:
  - goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
    image_templates:
      - m13tlabs/glab-docs:{{ .Version }}-amd64
      - m13tlabs/glab-docs:latest-amd64
  - goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
    image_templates:
      - m13tlabs/glab-docs:{{ .Version }}-arm64
      - m13tlabs/glab-docs:latest-arm64

docker_manifests:
  - name_template: m13tlabs/glab-docs:{{ .Version }}
    image_templates:
      - m13tlabs/glab-docs:{{ .Version }}-amd64
      - m13tlabs/glab-docs:{{ .Version }}-arm64
  - name_template: m13tlabs/glab-docs:latest
    image_templates:
      - m13tlabs/glab-docs:latest-amd64
      - m13tlabs/glab-docs:latest-arm64
